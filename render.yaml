services:
  - type: web
    name: zoomex-thumbnail-agent
    env: python
    plan: free
    buildCommand: python3 -m pip install -r requirements.txt
    startCommand: python3 thumbnail_agent.py serve --host 0.0.0.0 --port $PORT
    envVars:
      - key: HF_API_KEY_ID
        sync: false
      - key: HF_API_KEY_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: THUMBNAIL_IMAGE_PROVIDER
        value: higgsfield
      - key: THUMBNAIL_VISION_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_REVIEW_MODEL
        value: gemini-3.8-flash
